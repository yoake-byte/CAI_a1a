name: CAI_SO_FUN
channels:
  - defaults
  - conda-forge
dependencies:
  - python>=3.10,<3.13   # gensim's compiled C extensions use CPython internals removed in 3.13+,
                         # causing build failures on 3.13 or later.
  - numpy
  - scikit-learn
  - matplotlib             # Part C's data-efficiency curve is a graded plot.
  - pytorch
  - joblib>=1.5.2          # `evaluate.py`'s `load_model()` calls `joblib.load()` directly for
                           # CRF checkpoints — explicit now that it's load-bearing for
                           # reproducibility autograder check, not just a transitive dep of scikit-learn.
  - gensim                 # Optional: only if `embeddings.py` loads GloVe vectors via gensim.
                           # Installed via conda-forge (not pip) because conda-forge ships prebuilt
                           # gensim binaries per Python version, avoiding pip's from-source C-extension
                           # build, which fails on environments without a matching compiler/numpy ABI
                           # setup (e.g. PACE-ICE login nodes).
  - pip
  - pip:
      - sklearn-crfsuite   # Part A: CRF model itself — students do NOT hand-write CRF/Viterbi here.
      - seqeval            # Slot-F1 scorer (token & span level), matches course-provided `scorer.py`.
      - tqdm               # Convenience: progress bars for students' own `train.py` training loop.
      - tensorboard        # `train.py` skeleton wires up `--tensorboard-logdir` via `torch.utils.tensorboard.SummaryWriter`.
